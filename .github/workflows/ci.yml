name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: mcp-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run type-check --workspaces --if-present

      - name: Verify Jira MCP attribution enforcement
        run: npx vitest run packages/lambda-handlers/http/src/jiraAttribution.test.ts packages/lambda-handlers/http/src/jiraIssueLinks.test.ts --pool=forks --poolOptions.forks.singleFork=true

      - name: Hermes regression tests
        run: |
          npx vitest run \
            packages/hermes-control-plane/src/*.test.ts \
            packages/hermes-worker/src/*.test.ts \
            --pool=forks --poolOptions.forks.singleFork=true
